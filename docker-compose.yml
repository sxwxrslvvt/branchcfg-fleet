services:
  branchcfg:
    build: .
    # Для Linux задайте LOCAL_UID и LOCAL_GID, если ваш пользователь не 1000:1000.
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /work
    volumes:
      - ./:/work
    environment:
      BRANCHCFG_CONFIG: /work/config.example.yaml
      BRANCHCFG_OUTPUT: /work/output
      BRANCHCFG_LOG_LEVEL: INFO
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command: ["generate"]
