name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Verify committed example output
        run: python main.py check --output examples/generated --diff
      - name: Smoke test
        run: |
          python main.py generate --output /tmp/branchcfg-smoke
          python main.py check --output /tmp/branchcfg-smoke
