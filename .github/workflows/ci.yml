name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile and test
        run: |
          python -m compileall -q main.py tests
          python -m unittest discover -s tests -v
      - name: Verify examples
        run: python main.py check --output examples/generated --diff
      - name: Smoke test
        run: |
          python main.py generate --output /tmp/branchcfg-smoke
          python main.py check --output /tmp/branchcfg-smoke

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t branchcfg-fleet:ci .
      - name: Check container output
        run: |
          docker run --rm -v "$PWD:/work" -w /work --user "$(id -u):$(id -g)" branchcfg-fleet:ci check --config /work/config.example.yaml --output /work/examples/generated
